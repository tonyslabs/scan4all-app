name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: apps/app/src-tauri }
      - name: Dependencias Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: scan4all-${{ matrix.os }}
          path: apps/app/src-tauri/target/release/bundle/**/*

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # El runner ya trae el SDK de Android: se instalan solo las piezas que pide el proyecto
      # (setup-android falla con "sdkmanager tools" en las versiones nuevas del SDK).
      - name: SDK y NDK de Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - run: pnpm install --frozen-lockfile
      # El proyecto Android (gen/android) ya está en el repo: no se vuelve a generar. Sin llave de firma sale un APK sin firmar.
      - run: pnpm android:build --apk --target aarch64 --target armv7
      - uses: actions/upload-artifact@v4
        with:
          name: scan4all-android
          path: apps/app/src-tauri/gen/android/app/build/outputs/**/*.apk
