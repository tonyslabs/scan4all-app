# Landing de scan4all: estática, una sola página. Escucha en 8080 (usuario no root).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Solo lectura: nada de POST/PUT/DELETE
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Comprobación de salud (healthcheck de Docker y pruebas de disponibilidad)
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security.conf;
        return 200 "ok\n";
    }

    # Nada de archivos ocultos
    location ~ /\. { return 404; }

    location /assets/ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }
    # style.css, app.js y lib.js no llevan hash en el nombre: caché corta con revalidación
    location ~* \.(css|js)$ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }
    location / {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
